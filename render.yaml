services:
  - type: web
    name: gllms
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/scenarios
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: GOOGLE_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
