# Render Blueprint for GLLMS (LLM Attack Lab)
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: gllms
    runtime: python
    plan: free # change to "starter" or higher to avoid spin-down after inactivity
    autoDeploy: true
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/scenarios
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: GOOGLE_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
